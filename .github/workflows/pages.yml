name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html admin.html config.js favicon.ico .nojekyll assets css js vendor _site/
      - name: Cache-Busting (jede Version lädt sofort frisch)
        run: |
          V="${GITHUB_SHA::8}"
          cd _site
          # JS-Importe:  from './x.js'  →  from './x.js?v=…'
          find . -name '*.js' ! -path './vendor/*' -exec sed -i -E "s#(from '[^']+\.js)'#\1?v=${V}'#g" {} +
          # HTML: Skripte und Stylesheets
          sed -i -E "s#(src=\"js/[^\"]+\.js)\"#\1?v=${V}\"#g; s#(href=\"css/[^\"]+\.css)\"#\1?v=${V}\"#g" index.html admin.html
          grep -h "v=${V}" index.html admin.html js/app.js | head -5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
